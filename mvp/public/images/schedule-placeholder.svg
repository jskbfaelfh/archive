<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" direction="rtl">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#041633"/>
      <stop offset="50%" stop-color="#0a1e3b"/>
      <stop offset="100%" stop-color="#0c2b64"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="#f8fafc" rx="16"/>
  <rect width="900" height="600" fill="none" stroke="#cbd5e1" stroke-width="2" rx="16"/>

  <!-- University Header Ribbon -->
  <rect width="900" height="85" fill="url(#headerGrad)" rx="16"/>
  <rect y="70" width="900" height="15" fill="#041633"/>
  <text x="450" y="38" fill="#ffffff" font-family="'Cairo', system-ui, sans-serif" font-size="20" font-weight="900" text-anchor="middle">جامعة الزهراوي — كلية الطب البشري</text>
  <text x="450" y="65" fill="#38bdf8" font-family="'Cairo', system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">الجدول الأسبوعي لمحاضرات قسم الجراحة العامة — المرحلة الأولى (السبت إلى الأربعاء)</text>

  <!-- Table Header -->
  <g transform="translate(30, 105)">
    <rect width="840" height="42" fill="#0c2b64" rx="8"/>
    <text x="760" y="27" fill="#ffffff" font-family="'Cairo', sans-serif" font-size="13" font-weight="800" text-anchor="middle">اليوم</text>
    <text x="610" y="27" fill="#ffffff" font-family="'Cairo', sans-serif" font-size="13" font-weight="800" text-anchor="middle">08:30 - 10:00</text>
    <text x="450" y="27" fill="#ffffff" font-family="'Cairo', sans-serif" font-size="13" font-weight="800" text-anchor="middle">10:15 - 11:45</text>
    <text x="290" y="27" fill="#ffffff" font-family="'Cairo', sans-serif" font-size="13" font-weight="800" text-anchor="middle">12:00 - 01:30</text>
    <text x="130" y="27" fill="#ffffff" font-family="'Cairo', sans-serif" font-size="13" font-weight="800" text-anchor="middle">01:45 - 03:15</text>
  </g>

  <!-- Row 1: السبت -->
  <g transform="translate(30, 155)">
    <rect width="840" height="65" fill="#ffffff" stroke="#e2e8f0" rx="8"/>
    <rect x="700" width="140" height="65" fill="#f1f5f9" rx="8"/>
    <text x="770" y="38" fill="#041633" font-family="'Cairo', sans-serif" font-size="15" font-weight="900" text-anchor="middle">السبت</text>
    <text x="610" y="30" fill="#0f172a" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">التشريح السريري</text>
    <text x="610" y="48" fill="#64748b" font-family="'Cairo', sans-serif" font-size="10" text-anchor="middle">أ.د. حيدر كاظم (قاعة 1)</text>
    <text x="450" y="30" fill="#0f172a" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">فسيولوجيا الجراحة</text>
    <text x="450" y="48" fill="#64748b" font-family="'Cairo', sans-serif" font-size="10" text-anchor="middle">د. سارة التميمي</text>
    <text x="290" y="38" fill="#0284c7" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">استراحة وصلاة</text>
    <text x="130" y="30" fill="#0f172a" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">مختبر التشريح</text>
    <text x="130" y="48" fill="#64748b" font-family="'Cairo', sans-serif" font-size="10" text-anchor="middle">شعبة (أ) - مختبر 2</text>
  </g>

  <!-- Row 2: الأحد -->
  <g transform="translate(30, 227)">
    <rect width="840" height="65" fill="#ffffff" stroke="#e2e8f0" rx="8"/>
    <rect x="700" width="140" height="65" fill="#f1f5f9" rx="8"/>
    <text x="770" y="38" fill="#041633" font-family="'Cairo', sans-serif" font-size="15" font-weight="900" text-anchor="middle">الأحد</text>
    <text x="610" y="30" fill="#0f172a" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">الكيمياء الطبية</text>
    <text x="610" y="48" fill="#64748b" font-family="'Cairo', sans-serif" font-size="10" text-anchor="middle">د. عمر عبد الخالق</text>
    <text x="450" y="30" fill="#0f172a" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">التشريح السريري</text>
    <text x="450" y="48" fill="#64748b" font-family="'Cairo', sans-serif" font-size="10" text-anchor="middle">أ.د. حيدر كاظم</text>
    <text x="290" y="30" fill="#0f172a" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">مهارات طبية</text>
    <text x="290" y="48" fill="#64748b" font-family="'Cairo', sans-serif" font-size="10" text-anchor="middle">قاعة المحاكاة</text>
    <text x="130" y="38" fill="#94a3b8" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">—</text>
  </g>

  <!-- Row 3: الاثنين -->
  <g transform="translate(30, 299)">
    <rect width="840" height="65" fill="#ffffff" stroke="#e2e8f0" rx="8"/>
    <rect x="700" width="140" height="65" fill="#f1f5f9" rx="8"/>
    <text x="770" y="38" fill="#041633" font-family="'Cairo', sans-serif" font-size="15" font-weight="900" text-anchor="middle">الاثنين</text>
    <text x="610" y="30" fill="#0f172a" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">علم الأنسجة العام</text>
    <text x="610" y="48" fill="#64748b" font-family="'Cairo', sans-serif" font-size="10" text-anchor="middle">مختبر الهستولوجي</text>
    <text x="450" y="30" fill="#0f172a" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">فسيولوجيا الجراحة</text>
    <text x="450" y="48" fill="#64748b" font-family="'Cairo', sans-serif" font-size="10" text-anchor="middle">د. سارة التميمي</text>
    <text x="290" y="38" fill="#0284c7" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">استراحة وصلاة</text>
    <text x="130" y="30" fill="#0f172a" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">ندوة نقاشية سريرية</text>
    <text x="130" y="48" fill="#64748b" font-family="'Cairo', sans-serif" font-size="10" text-anchor="middle">رئاسة القسم</text>
  </g>

  <!-- Row 4: الثلاثاء -->
  <g transform="translate(30, 371)">
    <rect width="840" height="65" fill="#ffffff" stroke="#e2e8f0" rx="8"/>
    <rect x="700" width="140" height="65" fill="#f1f5f9" rx="8"/>
    <text x="770" y="38" fill="#041633" font-family="'Cairo', sans-serif" font-size="15" font-weight="900" text-anchor="middle">الثلاثاء</text>
    <text x="610" y="30" fill="#0f172a" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">التشريح السريري</text>
    <text x="610" y="48" fill="#64748b" font-family="'Cairo', sans-serif" font-size="10" text-anchor="middle">أ.د. حيدر كاظم</text>
    <text x="450" y="30" fill="#0f172a" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">أخلاقيات الطب</text>
    <text x="450" y="48" fill="#64748b" font-family="'Cairo', sans-serif" font-size="10" text-anchor="middle">قاعة المؤتمرات</text>
    <text x="290" y="30" fill="#0f172a" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">حاسوب ومعلوماتية</text>
    <text x="290" y="48" fill="#64748b" font-family="'Cairo', sans-serif" font-size="10" text-anchor="middle">مركز الحاسبة</text>
    <text x="130" y="38" fill="#94a3b8" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">—</text>
  </g>

  <!-- Row 5: الأربعاء -->
  <g transform="translate(30, 443)">
    <rect width="840" height="65" fill="#ffffff" stroke="#e2e8f0" rx="8"/>
    <rect x="700" width="140" height="65" fill="#f1f5f9" rx="8"/>
    <text x="770" y="38" fill="#041633" font-family="'Cairo', sans-serif" font-size="15" font-weight="900" text-anchor="middle">الأربعاء</text>
    <text x="610" y="30" fill="#0f172a" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">فسيولوجيا الجراحة</text>
    <text x="610" y="48" fill="#64748b" font-family="'Cairo', sans-serif" font-size="10" text-anchor="middle">د. سارة التميمي</text>
    <text x="450" y="30" fill="#0f172a" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">تطبيقات سريرية</text>
    <text x="450" y="48" fill="#64748b" font-family="'Cairo', sans-serif" font-size="10" text-anchor="middle">مستشفى الجامعة التعليمي</text>
    <text x="290" y="38" fill="#0284c7" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">استراحة وصلاة</text>
    <text x="130" y="30" fill="#0f172a" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">مراجعة أسبوعية</text>
    <text x="130" y="48" fill="#64748b" font-family="'Cairo', sans-serif" font-size="10" text-anchor="middle">قاعة 1</text>
  </g>

  <!-- Footer Certification -->
  <g transform="translate(30, 525)">
    <rect width="840" height="50" fill="#f1f5f9" rx="8"/>
    <text x="820" y="30" fill="#041633" font-family="'Cairo', sans-serif" font-size="11" font-weight="bold" text-anchor="start">
      ✓ معتمد رسمياً من رئاسة قسم الجراحة العامة — العام الدراسي 2026/2027
    </text>
    <text x="40" y="30" fill="#0284c7" font-family="'Cairo', sans-serif" font-size="11" font-weight="bold" text-anchor="end">
      نظام الجداول الأسبوعية الموحدة لجامعة الزهراوي
    </text>
  </g>
</svg>
